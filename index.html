<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowBoard — Drag & Drop Kanban By Adeeb Ali Developer</title>
<style>
  :root{
    --bg:#0d0d0d;
    --panel:#161616;
    --panel-2:#6767e3;
    --accent:#f1f908;
    --text:#f2f2f2;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter','Space Grotesk',sans-serif;
    min-height:100vh;
    padding:24px;
  }
  header{text-align:center;margin-bottom:24px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;}
  h1 span{color:var(--accent);}
  p{color:var(--muted);font-size:.9rem;margin-top:4px;}

  .add-task{
    max-width:900px;
    margin:0 auto 24px;
    display:flex;
    gap:10px;
  }
  input{
    flex:1;
    background:var(--panel-2);
    border:1px solid #2a2a2a;
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    outline:none;
  }
  input:focus{border-color:var(--accent);}
  button{
    background:var(--accent);
    color:#0d0d0d;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    max-width:1000px;
    margin:0 auto;
  }
  .column{
    background:var(--panel);
    border:1px solid #262626;
    border-radius:14px;
    padding:14px;
    min-height:420px;
    transition:background .2s, border-color .2s;
  }
  .column.drag-over{
    background:#1c2416;
    border-color:var(--accent);
  }
  .column h2{
    font-size:1rem;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count{
    background:var(--panel-2);
    padding:2px 9px;
    border-radius:20px;
    font-size:.75rem;
    color:var(--muted);
  }

  .task{
    background:var(--panel-2);
    border:1px solid #2a2a2a;
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:grab;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    transition:transform .15s, opacity .15s, border-color .15s;
  }
  .task:active{cursor:grabbing;}
  .task.dragging{opacity:.4;transform:scale(0.97);}
  .task span{font-size:.9rem;line-height:1.3;}
  .task .del{
    color:var(--muted);
    cursor:pointer;
    font-size:.85rem;
    flex-shrink:0;
  }
  .task .del:hover{color:#ff6b6b;}

  .empty-hint{
    color:#555;
    font-size:.8rem;
    text-align:center;
    padding:20px 0;
  }

  @media(max-width:720px){
    .board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <h1>Flow<span>Board By Adeeb Ali Developer</span> 🗂️</h1>
  <p>Native HTML5 Drag & Drop — persistent task mapping across columns</p>
</header>

<div class="add-task">
  <input type="text" id="newTask" placeholder="✏️ Add a new task...">
  <button onclick="addTask()">+ Add</button>
</div>

<div class="board">
  <div class="column" data-status="todo" id="col-todo">
    <h2>📝 To Do <span class="count" id="count-todo">0</span></h2>
    <div class="tasks" id="tasks-todo"></div>
  </div>
  <div class="column" data-status="progress" id="col-progress">
    <h2>🚧 In Progress <span class="count" id="count-progress">0</span></h2>
    <div class="tasks" id="tasks-progress"></div>
  </div>
  <div class="column" data-status="done" id="col-done">
    <h2>✅ Done <span class="count" id="count-done">0</span></h2>
    <div class="tasks" id="tasks-done"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = "flowboard_tasks";
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || [
    { id: crypto.randomUUID(), text: "Design landing page", status: "todo" },
    { id: crypto.randomUUID(), text: "Wire up drag events", status: "progress" },
    { id: crypto.randomUUID(), text: "Push to GitHub", status: "done" }
  ];

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addTask(){
    const input = document.getElementById("newTask");
    const text = input.value.trim();
    if(!text) return;
    tasks.push({ id: crypto.randomUUID(), text, status: "todo" });
    input.value = "";
    save();
    render();
  }

  document.getElementById("newTask").addEventListener("keydown", e => {
    if(e.key === "Enter") addTask();
  });

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function createTaskEl(task){
    const el = document.createElement("div");
    el.className = "task";
    el.draggable = true;
    el.dataset.id = task.id;
    el.innerHTML = `<span>${task.text}</span><span class="del" onclick="deleteTask('${task.id}')">✕</span>`;

    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", task.id);
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => el.classList.add("dragging"), 0);
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
    });
    return el;
  }

  function render(){
    ["todo","progress","done"].forEach(status => {
      const container = document.getElementById(`tasks-${status}`);
      container.innerHTML = "";
      const items = tasks.filter(t => t.status === status);
      document.getElementById(`count-${status}`).textContent = items.length;
      if(items.length === 0){
        container.innerHTML = `<div class="empty-hint">Drop tasks here</div>`;
      }else{
        items.forEach(t => container.appendChild(createTaskEl(t)));
      }
    });
  }

  document.querySelectorAll(".column").forEach(col => {
    col.addEventListener("dragover", e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", () => {
      col.classList.remove("drag-over");
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      const task = tasks.find(t => t.id === id);
      if(task){
        task.status = col.dataset.status;
        save();
        render();
      }
    });
  });

  render();
</script>
</body>
</html>
