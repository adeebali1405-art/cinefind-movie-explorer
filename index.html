<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFind — Movie Explorer By Adeeb Ali Developer</title>
<style>
  :root{
    --bg:#0d0d0d;
    --panel:#161616;
    --panel-2:#1e1e1e;
    --accent:#B9FF66;
    --text:#f2f2f2;
    --muted:#9a9a9a;
    --danger:#ff6b6b;
    --warn:#ffd166;
    --good:#B9FF66;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter','Space Grotesk',sans-serif;
    min-height:100vh;
  }
  header{
    padding:32px 24px 16px;
    text-align:center;
    border-bottom:1px solid #222;
  }
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:2.2rem;
    letter-spacing:-0.5px;
  }
  header h1 span{color:var(--accent);}
  header p{color:var(--muted);margin-top:6px;font-size:.95rem;}

  .container{max-width:1100px;margin:0 auto;padding:24px;}

  .setup{
    background:var(--panel);
    border:1px solid #262626;
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .setup input{flex:1;min-width:220px;}
  .setup small{color:var(--muted);width:100%;}

  .search-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  input, select{
    background:var(--panel-2);
    border:1px solid #2a2a2a;
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:.95rem;
    outline:none;
    transition:border-color .2s;
  }
  input:focus, select:focus{border-color:var(--accent);}
  .search-bar input[type="text"]{flex:2;min-width:220px;}
  .search-bar select{flex:1;min-width:120px;}

  button{
    background:var(--accent);
    color:#0d0d0d;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    font-size:.95rem;
    transition:transform .15s, opacity .15s;
  }
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(0);}
  button.secondary{
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
  }

  .status{color:var(--muted);text-align:center;padding:20px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:18px;
  }
  .card{
    background:var(--panel);
    border:1px solid #242424;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .2s, border-color .2s;
    position:relative;
  }
  .card:hover{transform:translateY(-6px);border-color:var(--accent);}
  .poster-wrap{position:relative;width:100%;aspect-ratio:2/3;background:#0a0a0a;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .flag{
    position:absolute;
    top:8px;right:8px;
    padding:4px 9px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:700;
    color:#0d0d0d;
  }
  .card-body{padding:12px 14px 16px;}
  .card-body h3{font-size:.95rem;line-height:1.3;margin-bottom:4px;}
  .card-body p{color:var(--muted);font-size:.8rem;text-transform:capitalize;}

  .modal-backdrop{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    z-index:50;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-backdrop.active{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid #2a2a2a;
    border-radius:16px;
    max-width:640px;width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:24px;
    position:relative;
  }
  .modal .close{
    position:absolute;top:14px;right:14px;
    background:var(--panel-2);
    border-radius:50%;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
    cursor:pointer;
    border:1px solid #333;
  }
  .modal-content{display:flex;gap:18px;flex-wrap:wrap;}
  .modal-content img{width:160px;border-radius:10px;flex-shrink:0;}
  .modal-info h2{font-family:'Space Grotesk',sans-serif;margin-bottom:8px;}
  .modal-info p{margin:6px 0;font-size:.9rem;color:#ccc;}
  .modal-info p b{color:var(--accent);}

  footer{text-align:center;color:var(--muted);padding:30px;font-size:.85rem;}
  a{color:var(--accent);}
  @media (max-width:480px){
    .modal-content img{width:100%;}
  }
</style>
</head>
<body>

<header>
  <h1>Cine<span>Find By Adeeb Ali Developer</span> 🎬</h1>
  <p>Real-time movie & series lookup, rating flags, and smart filters</p>
</header>

<div class="container">

  <div class="setup">
    <input type="password" id="apiKey" placeholder="🔑 Paste your free OMDb API key here...">
    <button class="secondary" onclick="saveKey()">Save Key</button>
    <small>Get a free key instantly at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank">omdbapi.com/apikey.aspx</a> — stored only in your browser.</small>
  </div>

  <div class="search-bar">
    <input type="text" id="query" placeholder="🔍 Search movies, series, episodes...">
    <select id="typeFilter">
      <option value="">All Types</option>
      <option value="movie">Movies</option>
      <option value="series">Series</option>
      <option value="episode">Episodes</option>
    </select>
    <input type="number" id="yearFilter" placeholder="Year" style="max-width:110px;">
    <button onclick="searchMovies()">Search</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results" class="grid"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="close" onclick="closeModal()">✕</div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<footer>Powered by the OMDb API · Built with vanilla HTML/CSS/JS</footer>

<script>
  const API_BASE = "https://www.omdbapi.com/";
  let apiKey = localStorage.getItem("omdb_key") || "";
  document.getElementById("apiKey").value = apiKey;

  function saveKey(){
    apiKey = document.getElementById("apiKey").value.trim();
    localStorage.setItem("omdb_key", apiKey);
    setStatus(apiKey ? "✅ Key saved. Try a search!" : "");
  }

  function setStatus(msg){
    document.getElementById("status").textContent = msg;
  }

  function ratingColor(rating){
    const r = parseFloat(rating);
    if(isNaN(r)) return "#555";
    if(r >= 7) return "var(--good)";
    if(r >= 5) return "var(--warn)";
    return "var(--danger)";
  }

  async function searchMovies(){
    const q = document.getElementById("query").value.trim();
    const type = document.getElementById("typeFilter").value;
    const year = document.getElementById("yearFilter").value.trim();

    if(!apiKey){ setStatus("⚠️ Please add your OMDb API key first."); return; }
    if(!q){ setStatus("⚠️ Type something to search."); return; }

    setStatus("⏳ Searching...");
    document.getElementById("results").innerHTML = "";

    let url = `${API_BASE}?apikey=${apiKey}&s=${encodeURIComponent(q)}`;
    if(type) url += `&type=${type}`;
    if(year) url += `&y=${year}`;

    try{
      const res = await fetch(url);
      const data = await res.json();
      if(data.Response === "False"){
        setStatus("❌ " + data.Error);
        return;
      }
      setStatus(`Found ${data.totalResults} results — showing top ${data.Search.length}, loading rating flags...`);
      renderResults(data.Search);
      enrichWithRatings(data.Search);
    }catch(err){
      setStatus("❌ Network error — check your key/connection.");
    }
  }

  function renderResults(list){
    const grid = document.getElementById("results");
    grid.innerHTML = list.map(m => `
      <div class="card" data-id="${m.imdbID}" onclick="openDetails('${m.imdbID}')">
        <div class="poster-wrap">
          <img src="${m.Poster !== 'N/A' ? m.Poster : 'https://via.placeholder.com/300x445/1e1e1e/666?text=No+Poster'}" alt="${m.Title}">
          <span class="flag" id="flag-${m.imdbID}" style="background:#333;">…</span>
        </div>
        <div class="card-body">
          <h3>${m.Title}</h3>
          <p>${m.Year} · ${m.Type}</p>
        </div>
      </div>
    `).join("");
  }

  async function enrichWithRatings(list){
    for(const m of list){
      try{
        const res = await fetch(`${API_BASE}?apikey=${apiKey}&i=${m.imdbID}`);
        const d = await res.json();
        const flag = document.getElementById(`flag-${m.imdbID}`);
        if(flag){
          flag.textContent = d.imdbRating && d.imdbRating !== "N/A" ? "★ " + d.imdbRating : "N/A";
          flag.style.background = ratingColor(d.imdbRating);
        }
      }catch(e){ /* skip on error */ }
    }
    setStatus(`Loaded ${list.length} results with rating flags.`);
  }

  async function openDetails(id){
    const res = await fetch(`${API_BASE}?apikey=${apiKey}&i=${id}&plot=full`);
    const d = await res.json();
    document.getElementById("modalContent").innerHTML = `
      <img src="${d.Poster !== 'N/A' ? d.Poster : 'https://via.placeholder.com/300x445'}" alt="${d.Title}">
      <div class="modal-info">
        <h2>${d.Title} (${d.Year})</h2>
        <p><b>Rating:</b> ★ ${d.imdbRating} / 10 (${d.imdbVotes} votes)</p>
        <p><b>Genre:</b> ${d.Genre}</p>
        <p><b>Director:</b> ${d.Director}</p>
        <p><b>Cast:</b> ${d.Actors}</p>
        <p><b>Runtime:</b> ${d.Runtime}</p>
        <p>${d.Plot}</p>
      </div>
    `;
    document.getElementById("modalBackdrop").classList.add("active");
  }

  function closeModal(){
    document.getElementById("modalBackdrop").classList.remove("active");
  }

  document.getElementById("query").addEventListener("keydown", e => {
    if(e.key === "Enter") searchMovies();
  });
</script>
</body>
</html>
